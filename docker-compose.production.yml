# Arciin — production Docker Compose (the only production definition)
#
# Every Docker install uses this file, installed as docker-compose.yml next to
# its .env (default /opt/arciin):
#   curl -fsSL https://get.arciin.com/install.sh | bash   (release asset)
#   ./install.sh --docker  /  ./scripts/docker-setup.sh   (from a checkout)
# Both run scripts/docker-install.sh. docker-compose.yml in the repository is
# for development only.
#
# Images are pinned by the installer from the release manifest, by tag and
# digest (ARCIIN_IMAGE_WEB / _API / _WORKER in .env). There is no floating
# :latest default: an unpinned production install is refused.
#
# Every service has `restart: unless-stopped`; with Docker enabled at boot the
# stack comes back after a reboot. Registry: ghcr.io/roberadesissaii-arc.

name: arciin

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "${ARCIIN_HTTP_PORT:-80}:80"
    volumes:
      # Installed next to this file. From a checkout without the installer:
      # ARCIIN_CADDYFILE=./docker/caddy/Caddyfile
      - ${ARCIIN_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${ARCIIN_IMAGE_WEB:?set by the Arciin installer (release manifest)}
    restart: unless-stopped
    # No env_file: public web tier must not hold back-end secrets.
    environment:
      NODE_ENV: production
      ARCIIN_PUBLIC_URL: ${ARCIIN_PUBLIC_URL:-http://localhost}
      ARCIIN_API_URL: ${ARCIIN_API_URL:-http://api:4000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      # Empty: browser uses same origin (Caddy → /socket.io → api)
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
      NEXT_PUBLIC_ARCIIN_PUBLIC_URL: ${NEXT_PUBLIC_ARCIIN_PUBLIC_URL:-}
    depends_on:
      api:
        condition: service_started
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  api:
    image: ${ARCIIN_IMAGE_API:?set by the Arciin installer (release manifest)}
    restart: unless-stopped
    env_file:
      - .env
    user: "${ARCIIN_PUID:-1000}:${ARCIIN_PGID:-1000}"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://arciin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/arciin
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      ARCIIN_DATA_DIR: ${ARCIIN_DATA_DIR:-/data/arciin}
      ARCIIN_HOST_DATA_DIR: ${ARCIIN_HOST_DATA_DIR:-/srv/arciin-storage/arciin}
      ARCIIN_PUBLIC_URL: ${ARCIIN_PUBLIC_URL:-http://localhost}
      ARCIIN_HTTP_PORT: ${ARCIIN_HTTP_PORT:-80}
      ARCIIN_API_URL: ${ARCIIN_API_URL:-http://api:4000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
      ARCIIN_TUNNEL_TARGET: ${ARCIIN_TUNNEL_TARGET:-http://caddy:80}
      ARCIIN_TRUST_PROXY: ${ARCIIN_TRUST_PROXY:-172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16, 127.0.0.1/8, ::1/128}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    volumes:
      - ${ARCIIN_HOST_DATA_DIR:-/srv/arciin-storage/arciin}:/data/arciin

  worker:
    image: ${ARCIIN_IMAGE_WORKER:?set by the Arciin installer (release manifest)}
    restart: unless-stopped
    env_file:
      - .env
    user: "${ARCIIN_PUID:-1000}:${ARCIIN_PGID:-1000}"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 1500m
    cpus: "1.5"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://arciin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/arciin
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      ARCIIN_DATA_DIR: ${ARCIIN_DATA_DIR:-/data/arciin}
      ARCIIN_HOST_DATA_DIR: ${ARCIIN_HOST_DATA_DIR:-/srv/arciin-storage/arciin}
      ARCIIN_WORKER_CONCURRENCY: ${ARCIIN_WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ${ARCIIN_HOST_DATA_DIR:-/srv/arciin-storage/arciin}:/data/arciin
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arciin
      POSTGRES_USER: arciin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arciin -d arciin"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
      ]
    volumes:
      - redis_data:/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  redis_data:
