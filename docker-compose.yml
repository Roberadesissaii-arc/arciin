services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ARCIIN_PUBLIC_URL: http://localhost
      ARCIIN_API_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SOCKET_URL: http://localhost
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://arciin:arciin@postgres:5432/arciin
      REDIS_URL: redis://redis:6379
      ARCIIN_DATA_DIR: /data/arciin
      ARCIIN_PUBLIC_URL: http://localhost
      ARCIIN_API_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SOCKET_URL: http://localhost
    depends_on:
      - postgres
      - redis
    volumes:
      - arciin_data:/data/arciin

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://arciin:arciin@postgres:5432/arciin
      REDIS_URL: redis://redis:6379
      ARCIIN_DATA_DIR: /data/arciin
    depends_on:
      - postgres
      - redis
      - api
    volumes:
      - arciin_data:/data/arciin

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arciin
      POSTGRES_USER: arciin
      POSTGRES_PASSWORD: arciin
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  arciin_data:
