services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        ARCIIN_PUBLIC_URL: http://localhost
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ARCIIN_PUBLIC_URL: http://localhost
      ARCIIN_API_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: /api
      # Leave empty: browser uses window.location.origin (Caddy :80 → /socket.io → api)
      NEXT_PUBLIC_SOCKET_URL: ""
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://arciin:arciin@postgres:5432/arciin
      REDIS_URL: redis://redis:6379
      ARCIIN_DATA_DIR: /data/arciin
      ARCIIN_PUBLIC_URL: http://localhost
      ARCIIN_API_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SOCKET_URL: http://localhost
      # cloudflared runs in the api container; forward to Caddy (not 127.0.0.1)
      ARCIIN_TUNNEL_TARGET: http://caddy:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind mount: files live on the host (SSD/HDD). Set ARCIIN_HOST_DATA_DIR in .env
      - ${ARCIIN_HOST_DATA_DIR:-/srv/arciin-storage/arciin}:/data/arciin

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://arciin:arciin@postgres:5432/arciin
      REDIS_URL: redis://redis:6379
      ARCIIN_DATA_DIR: /data/arciin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ${ARCIIN_HOST_DATA_DIR:-/srv/arciin-storage/arciin}:/data/arciin

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arciin
      POSTGRES_USER: arciin
      POSTGRES_PASSWORD: arciin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arciin -d arciin"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  redis_data:
