name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway CI credentials only. Not production secrets.
  CI_DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin
  CI_TEST_DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin_test
  CI_E2E_DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin_dev
  CI_MIGRATE_DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin_migrate

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and typecheck
        run: pnpm typecheck

  lint-policy:
    name: Lint policy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repo-wide ESLint (known debt; does not gate release)
        run: pnpm lint

  test:
    name: Unit, license, integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arciin
          POSTGRES_PASSWORD: arciin
          POSTGRES_DB: arciin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arciin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Unit suite
        run: pnpm test
      - name: License authority suite
        run: pnpm test:license
      - name: Apply the real Prisma migration chain
        run: |
          PGPASSWORD=arciin psql -h localhost -U arciin -d arciin \
            -c "CREATE DATABASE arciin_migrate" || true
          PGPASSWORD=arciin psql -h localhost -U arciin -d arciin \
            -c "CREATE DATABASE arciin_test" || true
          DATABASE_URL=postgresql://arciin:arciin@localhost:5432/arciin_migrate \
            pnpm exec prisma migrate deploy
          DATABASE_URL=postgresql://arciin:arciin@localhost:5432/arciin_test \
            pnpm exec prisma migrate deploy
      - name: Integration suite
        env:
          DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin_test
          TEST_DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin_test
          REDIS_URL: redis://localhost:6379
        run: pnpm test:integration
      - name: Install parity
        run: bash scripts/verify-install-parity.sh

  e2e:
    name: Deterministic browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arciin
          POSTGRES_PASSWORD: arciin
          POSTGRES_DB: arciin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arciin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: development
      ARCIIN_ENV_NAMESPACE: dev
      # CI=true keeps playwright.config / e2e-seed from overlaying laptop paths.
      DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin_dev
      REDIS_URL: redis://127.0.0.1:6379/14
      ARCIIN_DATA_DIR: /tmp/arciin-e2e-storage
      ARCIIN_QUEUE_PREFIX: bull-dev
      ARCIIN_SOCKET_CHANNEL_PREFIX: dev
      ARCIIN_SETUP_TOKEN: ci-e2e-setup-token
      SESSION_SECRET: ci-e2e-session-secret-min-32-characters
      E2E_WEB_PORT: "3300"
      E2E_API_PORT: "4300"
      API_PORT: "4300"
      PORT: "3300"
      ARCIIN_PUBLIC_URL: http://127.0.0.1:3300
      ARCIIN_API_URL: http://127.0.0.1:4300
      NEXT_PUBLIC_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Create isolated E2E database and migrate
        run: |
          PGPASSWORD=arciin psql -h localhost -U arciin -d arciin \
            -c "CREATE DATABASE arciin_dev" || true
          DATABASE_URL=postgresql://arciin:arciin@localhost:5432/arciin_dev \
            pnpm exec prisma migrate deploy
          mkdir -p /tmp/arciin-e2e-storage
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Deterministic E2E
        run: pnpm exec playwright test --config playwright.ci.config.ts
      - name: Retain Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          if-no-files-found: ignore
          path: |
            test-results/
            reports/playwright/

  e2e-external:
    name: Optional provider E2E
    if: ${{ vars.E2E_GEMINI_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: External provider E2E is optional
        run: echo "Configure a dedicated E2E_GEMINI_API_KEY repository variable to enable this job. Not required for PR gates."

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Production backend + web build
        run: NODE_ENV=production pnpm build
        env:
          DATABASE_URL: postgresql://arciin:arciin@localhost:5432/arciin
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_ARCIIN_API_ORIGIN: http://localhost:4000
          NEXT_PUBLIC_SOCKET_URL: ""
      - name: Browser bundle carries no server configuration
        # Runs against the build just made. In the unit job no build exists
        # yet, so this suite skips there; this is where it actually bites.
        run: pnpm exec vitest run tests/client-bundle-boundary.test.ts
        env:
          ARCIIN_WEB_DIST: .next-build
