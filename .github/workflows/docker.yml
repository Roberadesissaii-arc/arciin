name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Pull requests build all three images without pushing them, so a release
  # candidate proves its images build before it is merged — not after.
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── build & push all three images in parallel ─────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
          - service: web
          - service: worker

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix (GHCR requires lowercase paths)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner}/arciin" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.prefix }}-${{ matrix.service }}
          tags: |
            # branch push → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # tag push → :v1.2.3 and :1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # always tag the git SHA for traceability
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── print the image URLs when done ────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Lowercase image prefix
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner}/arciin" >> "$GITHUB_OUTPUT"

      - name: Print image URLs
        run: |
          echo "### Docker images pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ steps.image.outputs.prefix }}-api\` | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ steps.image.outputs.prefix }}-web\` | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ steps.image.outputs.prefix }}-worker\` | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull: \`docker pull ${{ steps.image.outputs.prefix }}-api:latest\`" >> $GITHUB_STEP_SUMMARY
